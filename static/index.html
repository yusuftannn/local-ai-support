<!doctype html>
<html lang="tr">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>AI Talep Analizi</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }
    body {
      margin: 0;
      background: #f4f7fb;
      color: #172238;
      font:
        16px system-ui,
        sans-serif;
    }
    .navbar {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #dce3ef;
      backdrop-filter: blur(12px);
    }
    .nav-inner {
      max-width: 1000px;
      min-height: 68px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #172238;
      font-weight: 750;
      text-decoration: none;
      white-space: nowrap;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: #315bd3;
      color: white;
      font-size: 17px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-links a {
      padding: 9px 12px;
      border-radius: 7px;
      color: #58667d;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .nav-links a:hover,
    .nav-links a:focus-visible {
      background: #edf1fa;
      color: #2946a0;
    }
    .nav-links a[aria-disabled="true"] {
      opacity: 0.45;
      pointer-events: none;
    }
    .skip-link {
      position: absolute;
      top: -50px;
      left: 12px;
      z-index: 3;
      padding: 10px 14px;
      background: white;
      color: #172238;
    }
    .skip-link:focus {
      top: 8px;
    }
    main {
      max-width: 900px;
      margin: 42px auto 60px;
      padding: 24px;
    }
    header {
      margin-bottom: 28px;
    }
    h1 {
      font-size: 36px;
      margin: 10px 0;
    }
    p {
      color: #58667d;
      line-height: 1.6;
    }
    .tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #3660d3;
    }
    .card {
      background: white;
      border: 1px solid #dce3ef;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      font: inherit;
      padding: 15px;
      border: 1px solid #b6c3d6;
      border-radius: 10px;
      margin: 12px 0;
    }
    button {
      background: #315bd3;
      border: 0;
      color: white;
      border-radius: 9px;
      padding: 13px 20px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .example {
      background: #edf1fa;
      color: #29406b;
      font-size: 13px;
      padding: 9px;
      margin: 5px 5px 5px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    h2 {
      font-size: 14px;
      color: #596981;
      margin: 0 0 10px;
    }
    .value {
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .copy-button {
      flex: 0 0 auto;
      padding: 7px 11px;
      background: #edf1fa;
      color: #29406b;
      font-size: 13px;
    }
    .copy-status {
      min-height: 20px;
      margin: 8px 0 0;
      font-size: 13px;
    }
    #status {
      font-size: 13px;
    }
    #error {
      color: #a32032;
    }
    label {
      font-weight: 600;
    }
    .character-count {
      margin: -4px 0 10px;
      color: #58667d;
      font-size: 12px;
      text-align: right;
    }
    :focus-visible {
      outline: 3px solid #82a1ff;
      outline-offset: 3px;
    }
    @media (max-width: 600px) {
      .nav-inner {
        min-height: 60px;
        padding: 0 16px;
      }
      .brand {
        gap: 7px;
        font-size: 14px;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
      }
      .nav-links {
        gap: 0;
      }
      .nav-links a {
        padding: 8px;
        font-size: 13px;
      }
      main {
        margin: 20px auto;
        padding: 18px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 28px;
      }
    }
  </style>
  <body>
    <a class="skip-link" href="#request">İçeriğe geç</a>
    <nav class="navbar" aria-label="Ana gezinme">
      <div class="nav-inner">
        <a class="brand" href="#top" aria-label="AI Talep Analizi ana sayfa">
          <span class="brand-mark" aria-hidden="true">AI</span>
          <span>Talep Analizi</span>
        </a>
        <div class="nav-links">
          <a href="#request">Yeni analiz</a>
          <a id="results-link" href="#results" aria-disabled="true" tabindex="-1">Sonuçlar</a>
        </div>
      </div>
    </nav>
    <main id="top">
    <header>
      <span class="tag">PYTHON × YAPAY ZEKA</span>
      <h1>Talebi anla. Yanıtı hazırla.</h1>
      <p>Yerel AI modeliyle kategori, konu, özet ve yanıt taslağı oluştur.</p>
      <div id="status" role="status">Model bağlantısı kontrol ediliyor…</div>
    </header>
    <section class="card" id="request">
      <form id="form">
        <label for="message">Müşteri mesajı</label
        ><textarea
          id="message"
          minlength="5"
          maxlength="3000"
          required
          placeholder="Video yükledim ama ikinci sahnede açılmıyor."
        ></textarea>
        <div class="character-count" id="character-count" aria-live="polite">0 / 3000</div>
        <div>
          <button type="button" class="example">
            Video yükledim ama ikinci sahnede açılmıyor.</button
          ><button type="button" class="example">
            Raporları Excel olarak indirebilir miyiz?
          </button>
        </div>
        <p><button id="submit">Analiz et</button></p>
      </form>
      <p id="error" role="alert" hidden></p>
    </section>
    <section id="results" hidden aria-live="polite">
      <div class="grid">
        <div class="card">
          <h2>Kategori</h2>
          <div id="category" class="value"></div>
        </div>
        <div class="card">
          <h2>Konu</h2>
          <div id="topic" class="value"></div>
        </div>
      </div>
      <div class="card">
        <h2>Özet</h2>
        <div id="summary" class="value"></div>
      </div>
      <div class="card">
        <div class="result-heading">
          <h2>Yanıt taslağı</h2>
          <button id="copy-reply" class="copy-button" type="button">Yanıtı kopyala</button>
        </div>
        <div id="reply" class="value"></div>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
        <p>Göndermeden önce taslağı kontrol et.</p>
      </div>
    </section>
    </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const labels = {
      hata: "Hata bildirimi",
      ozellik_istegi: "Özellik isteği",
      soru: "Soru",
      diger: "Diğer",
    };
    async function checkHealth() {
      try {
        const r = await fetch("/api/health");
        if (!r.ok) throw Error();
        const d = await r.json();
        $("status").textContent = d.model_ready
          ? `Hazır · ${d.model}`
          : d.ollama_available
            ? `Modeli indir: ollama pull ${d.model}`
            : "Ollama uygulamasını açarak bağlantıyı başlat.";
      } catch {
        $("status").textContent = "Python servisine ulaşılamadı.";
      }
    }
    checkHealth();
    $("message").addEventListener("input", () => {
      $("character-count").textContent = `${$("message").value.length} / 3000`;
    });
    document.querySelectorAll(".example").forEach(
      (b) =>
        (b.onclick = () => {
          $("message").value = b.textContent;
          $("character-count").textContent = `${$("message").value.length} / 3000`;
          $("message").focus();
        }),
    );
      $("copy-reply").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText($("reply").textContent);
          $("copy-status").textContent = "Yanıt panoya kopyalandı.";
        } catch {
          $("copy-status").textContent = "Kopyalanamadı. Yanıtı seçip kopyalayın.";
        }
      });
    $("form").onsubmit = async (event) => {
      event.preventDefault();
      $("error").hidden = true;
      $("results").hidden = true;
      $("results-link").setAttribute("aria-disabled", "true");
      $("results-link").tabIndex = -1;
      $("submit").disabled = true;
      $("submit").textContent = "Analiz ediliyor…";
      try {
        const r = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: $("message").value }),
        });
        const d = await r.json();
        if (!r.ok)
          throw Error(
            typeof d.detail === "string"
              ? d.detail
              : "En az 5 karakterlik bir mesaj girin.",
          );
        for (const key of ["category", "topic", "summary", "reply"])
          $(key).textContent = key === "category" ? labels[d[key]] : d[key];
        $("results").hidden = false;
        $("results-link").setAttribute("aria-disabled", "false");
        $("results-link").tabIndex = 0;
      } catch (e) {
        $("error").textContent = e.message;
        $("error").hidden = false;
      } finally {
        $("submit").disabled = false;
        $("submit").textContent = "Analiz et";
        checkHealth();
      }
    };
  </script>
  </body>
</html>
