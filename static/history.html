<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geçmiş · AI Talep Analizi</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --stroke: #dce3ef;
        --text: #172238;
        --muted: #58667d;
        --primary: #315bd3;
        --primary-soft: #edf1fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.6 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 30px 20px 60px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: white;
        border-radius: 10px;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .nav a, .primary-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 700;
      }
      .nav a {
        background: var(--panel);
        border: 1px solid var(--stroke);
      }
      .primary-btn {
        background: var(--primary);
        color: white;
      }
      .hero {
        background: white;
        border: 1px solid var(--stroke);
        border-radius: 20px;
        padding: 22px 24px;
        margin-bottom: 18px;
      }
      .eyebrow {
        color: var(--primary);
        letter-spacing: 1.5px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 6px;
        font-size: clamp(30px, 4vw, 42px);
      }
      .muted {
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 16px 0;
      }
      .filters {
        display: grid;
        grid-template-columns: minmax(220px, 2fr) repeat(2, minmax(160px, 1fr));
        gap: 12px;
        margin: 20px 0;
      }
      .filters label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .filters input, .filters select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--stroke);
        border-radius: 10px;
        background: white;
        color: var(--text);
        font: inherit;
      }
      .pager {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pager button {
        padding: 8px 12px;
        border: 1px solid var(--stroke);
        border-radius: 9px;
        background: white;
        color: var(--text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .pager button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 3px solid #82a1ff;
        outline-offset: 2px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        overflow: hidden;
      }
      th, td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--stroke);
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #fafcff;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      tbody tr:last-child td { border-bottom: 0; }
      .pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
      }
      .empty {
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        padding: 24px;
      }
      @media (max-width: 780px) {
        .filters { grid-template-columns: 1fr; }
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; }
        tr { border-bottom: 1px solid var(--stroke); }
        td { border-bottom: none; padding: 8px 14px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark">AI</span>
          <span>Talep Analizi</span>
        </div>
        <nav class="nav" aria-label="Sayfa gezinmesi">
          <a href="/">Ana sayfa</a>
          <a href="/dashboard">Yönetim paneli</a>
          <a href="/docs">API</a>
        </nav>
      </div>

      <section class="hero">
        <div class="eyebrow">Kayıtlar</div>
        <h1>Geçmiş değerlendirmeler</h1>
        <p class="muted">Bu cihazdaki yerel kayıtlar ve yapılan düzeltmeler burada görünür.</p>
      </section>

      <form class="filters" id="filters">
        <label for="search">Mesajlarda ara
          <input id="search" type="search" maxlength="200" placeholder="Örn. video, rapor" />
        </label>
        <label for="category">Düzeltilmiş kategori
          <select id="category">
            <option value="">Tüm kategoriler</option>
            <option value="hata">Hata bildirimi</option>
            <option value="ozellik_istegi">Özellik isteği</option>
            <option value="soru">Soru</option>
            <option value="diger">Diğer</option>
          </select>
        </label>
        <label for="priority">Düzeltilmiş öncelik
          <select id="priority">
            <option value="">Tüm öncelikler</option>
            <option value="yuksek">Yüksek</option>
            <option value="normal">Normal</option>
            <option value="dusuk">Düşük</option>
          </select>
        </label>
      </form>

      <div class="toolbar">
        <span class="pill" id="row-count" aria-live="polite">Kayıtlar yükleniyor…</span>
        <div class="pager">
          <button id="previous-page" type="button" disabled>Önceki</button>
          <span class="muted" id="page-number">—</span>
          <button id="next-page" type="button" disabled>Sonraki</button>
        </div>
        <a class="primary-btn" href="/api/feedback/export" download>CSV dışa aktar</a>
      </div>

      <div id="history-root"></div>
    </div>

    <script>
      const pageSize = 20;
      let offset = 0;
      let searchTimer;
      const labels = {
        hata: 'Hata bildirimi',
        ozellik_istegi: 'Özellik isteği',
        soru: 'Soru',
        diger: 'Diğer',
        dusuk: 'Düşük',
        normal: 'Normal',
        yuksek: 'Yüksek',
      };

      function addCell(row, value, className) {
        const cell = document.createElement('td');
        cell.textContent = value;
        if (className) cell.className = className;
        row.appendChild(cell);
      }

      function renderHistory(items) {
        const root = document.getElementById('history-root');
        root.replaceChildren();
        if (!items.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          const heading = document.createElement('strong');
          const hasFilters = document.getElementById('search').value.trim()
            || document.getElementById('category').value
            || document.getElementById('priority').value;
          heading.textContent = hasFilters ? 'Eşleşen kayıt bulunamadı.' : 'Henüz kayıt yok.';
          const detail = document.createElement('p');
          detail.className = 'muted';
          detail.textContent = hasFilters
            ? 'Arama veya filtreleri değiştirip yeniden deneyin.'
            : 'İlk değerlendirmeyi ana sayfadaki formdan kaydedebilirsiniz.';
          empty.append(heading, detail);
          root.appendChild(empty);
          return;
        }

        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Tarih</th><th>Mesaj</th><th>Model tahmini</th><th>Doğru etiket</th><th>Öncelik</th></tr></thead>';
        const body = document.createElement('tbody');
        items.forEach(item => {
          const row = document.createElement('tr');
          const createdAt = new Date(item.created_at);
          addCell(row, Number.isNaN(createdAt.getTime())
            ? item.created_at
            : createdAt.toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' }));
          const message = item.message || '';
          addCell(row, `${message.slice(0, 180)}${message.length > 180 ? '…' : ''}`);
          addCell(row, `${labels[item.predicted_category] || item.predicted_category} / ${labels[item.predicted_priority] || item.predicted_priority}`);
          addCell(row, `${labels[item.corrected_category] || item.corrected_category} / ${labels[item.corrected_priority] || item.corrected_priority}`);
          addCell(row, labels[item.corrected_priority] || item.corrected_priority, 'pill');
          body.appendChild(row);
        });
        table.appendChild(body);
        root.appendChild(table);
      }

      async function loadHistory() {
        const root = document.getElementById('history-root');
        const params = new URLSearchParams({
          limit: String(pageSize),
          offset: String(offset),
          search: document.getElementById('search').value.trim(),
        });
        const category = document.getElementById('category').value;
        const priority = document.getElementById('priority').value;
        if (category) params.set('category', category);
        if (priority) params.set('priority', priority);
        try {
          const response = await fetch(`/api/feedback?${params}`);
          if (!response.ok) throw new Error('History unavailable');
          const payload = await response.json();
          const total = payload.total || 0;
          const page = Math.floor(offset / pageSize) + 1;
          const pages = Math.max(1, Math.ceil(total / pageSize));
          document.getElementById('row-count').textContent = `${total} kayıt`;
          document.getElementById('page-number').textContent = total ? `${page} / ${pages}` : '0 / 0';
          document.getElementById('previous-page').disabled = offset === 0;
          document.getElementById('next-page').disabled = offset + pageSize >= total;
          renderHistory(payload.items || []);
        } catch {
          document.getElementById('row-count').textContent = 'Kayıtlar yüklenemedi';
          document.getElementById('page-number').textContent = '—';
          document.getElementById('previous-page').disabled = true;
          document.getElementById('next-page').disabled = true;
          root.replaceChildren();
          const error = document.createElement('div');
          error.className = 'empty';
          const heading = document.createElement('strong');
          heading.textContent = 'Geçmiş verisine ulaşılamadı.';
          const detail = document.createElement('p');
          detail.className = 'muted';
          detail.textContent = 'Daha sonra tekrar deneyin.';
          error.append(heading, detail);
          root.appendChild(error);
        }
      }

      document.getElementById('filters').addEventListener('submit', event => event.preventDefault());
      document.getElementById('search').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          offset = 0;
          loadHistory();
        }, 250);
      });
      ['category', 'priority'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          offset = 0;
          loadHistory();
        });
      });
      document.getElementById('previous-page').addEventListener('click', () => {
        offset = Math.max(0, offset - pageSize);
        loadHistory();
      });
      document.getElementById('next-page').addEventListener('click', () => {
        offset += pageSize;
        loadHistory();
      });
      loadHistory();
    </script>
  </body>
</html>
