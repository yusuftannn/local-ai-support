<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geçmiş · AI Talep Analizi</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --stroke: #dce3ef;
        --text: #172238;
        --muted: #58667d;
        --primary: #315bd3;
        --primary-soft: #edf1fa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.6 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 30px 20px 60px;
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: white;
        border-radius: 10px;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .nav a, .primary-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 700;
      }
      .nav a {
        background: var(--panel);
        border: 1px solid var(--stroke);
      }
      .primary-btn {
        background: var(--primary);
        color: white;
      }
      .hero {
        background: white;
        border: 1px solid var(--stroke);
        border-radius: 20px;
        padding: 22px 24px;
        margin-bottom: 18px;
      }
      .eyebrow {
        color: var(--primary);
        letter-spacing: 1.5px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 6px;
        font-size: clamp(30px, 4vw, 42px);
      }
      .muted {
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 16px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        overflow: hidden;
      }
      th, td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--stroke);
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #fafcff;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      tbody tr:last-child td { border-bottom: 0; }
      .pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
      }
      .empty {
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        padding: 24px;
      }
      @media (max-width: 780px) {
        table, thead, tbody, th, td, tr { display: block; }
        thead { display: none; }
        tr { border-bottom: 1px solid var(--stroke); }
        td { border-bottom: none; padding: 8px 14px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark">AI</span>
          <span>Talep Analizi</span>
        </div>
        <nav class="nav" aria-label="Sayfa gezinmesi">
          <a href="/">Ana sayfa</a>
          <a href="/dashboard">Yönetim paneli</a>
          <a href="/docs">API</a>
        </nav>
      </div>

      <section class="hero">
        <div class="eyebrow">Kayıtlar</div>
        <h1>Geçmiş değerlendirmeler</h1>
        <p class="muted">Bu cihazdaki yerel kayıtlar ve yapılan düzeltmeler burada görünür.</p>
      </section>

      <div class="toolbar">
        <span class="pill" id="row-count">0 kayıt</span>
        <a class="primary-btn" href="/api/feedback/export" download>CSV dışa aktar</a>
      </div>

      <div id="history-root"></div>
    </div>

    <script>
      async function loadHistory() {
        const root = document.getElementById('history-root');
        try {
          const response = await fetch('/api/feedback?limit=20');
          if (!response.ok) throw new Error('History unavailable');
          const payload = await response.json();
          const items = payload.items || [];
          document.getElementById('row-count').textContent = `${items.length} kayıt`;

          if (!items.length) {
            root.innerHTML = '<div class="empty"><strong>Henüz kayıt yok.</strong><p class="muted">İlk değerlendirmeyi ana sayfadaki formdan kaydetmeniz gerekiyor.</p></div>';
            return;
          }

          root.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Tarih</th>
                  <th>Mesaj</th>
                  <th>Model tahmini</th>
                  <th>Doğru etiket</th>
                  <th>Öncelik</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(item => `
                  <tr>
                    <td>${new Date(item.created_at).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' })}</td>
                    <td>${(item.message || '').slice(0, 180)}${(item.message || '').length > 180 ? '…' : ''}</td>
                    <td>${item.predicted_category} / ${item.predicted_priority}</td>
                    <td>${item.corrected_category} / ${item.corrected_priority}</td>
                    <td><span class="pill">${item.corrected_priority}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        } catch (error) {
          root.innerHTML = '<div class="empty"><strong>Geçmiş verisine ulaşılamadı.</strong><p class="muted">Daha sonra tekrar deneyin.</p></div>';
        }
      }

      loadHistory();
    </script>
  </body>
</html>
